name: Publish tzdata rebuilds on ghcr.io
# Rebuilds a published image with a newer tzdata only (wiremind/tzdata/Dockerfile).
# The image takes the name of the tag, e.g. 4.0-wiremind0-tzdata2026e gives spilo-17:4.0-wiremind0-tzdata2026e.
on:
  push:
    tags:
      - '*-tzdata*'

env:
  IMAGE: ghcr.io/${{ github.repository }}-17:${{ github.ref_name }}

jobs:
  publish:
    name: Build, test and push the tzdata rebuild
    runs-on: ubuntu-22.04
    permissions:
      contents: 'read'
      packages: 'write'
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up packages
      run: sudo apt-get install -y docker-compose

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Login to GHCR
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and export to local docker for testing
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: "wiremind/tzdata/"
        load: true
        tags: ${{ env.IMAGE }}

    - name: Test spilo docker image
      env:
        SPILO_TEST_IMAGE: ${{ env.IMAGE }}
      run: |
        bash postgres-appliance/tests/test_spilo.sh

    - name: Push the image to ghcr
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: "wiremind/tzdata/"
        push: true
        tags: ${{ env.IMAGE }}
        platforms: linux/amd64
